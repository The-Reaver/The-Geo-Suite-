# GEO Suite backend. FastAPI app serving the audit engine, compliance
# checker, site generator, sales/prospecting wizard, and Nova.
# Split out of Stag-GEO-Platform 2026-08-19: this repo carries only GEO's
# working code and its own independent Supabase project. Every secret
# loads from environment files through app/config.py, never from code.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "geo-suite-backend"
version = "0.1.0"
description = "GEO Suite FastAPI backend: audit engine, compliance checker, site generator, sales/prospecting, Nova."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "STAG" }
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic[email]>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "supabase>=2.5,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pyjwt[crypto]>=2.8,<3.0",
  "requests>=2.31,<3.0",
  # Renders reporting/render_html.py's static HTML+CSS (inline-SVG charts,
  # no JS) straight to real PDF bytes for /reports/export's fmt="pdf".
  # Needs the Pango stack as a system dependency at runtime -- see
  # Dockerfile.
  "weasyprint>=69,<70",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.5,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
